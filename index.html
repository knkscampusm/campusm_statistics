<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의대관 모집 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#26302f; --muted:#6b7473; --line:#dde3e2; --bg:#f0f0f0; --panel:#fff;
  --teal:#3dbbb1; --teal-d:#1f8a82; --teal-l:#e3f4f2; --warn:#b4741c; --err:#b5463f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-d);outline-offset:2px}

header{background:var(--ink);color:#fff;padding:18px 24px 0}
.hrow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
h1 span{font-weight:400;color:#a9b5b3;margin-left:6px}
.me{margin-left:auto;font-size:13px;color:#a9b5b3;display:flex;gap:10px;align-items:center}
.me button{background:none;border:1px solid #56615f;color:#d8dfde;border-radius:6px;padding:3px 10px;cursor:pointer}
nav{display:flex;gap:2px;max-width:1240px;margin:14px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:#a9b5b3;padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--teal)}

.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar>div{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>b{font-size:13px;color:var(--muted);font-weight:500;margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg{border:0;background:#fff;padding:5px 14px;cursor:pointer;border-left:1px solid var(--line)}
.seg:first-child{border-left:0}
.seg.on{background:var(--teal-l);color:var(--teal-d);font-weight:600}
#tabTools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#tabTools select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
#status{font-size:13px;color:var(--muted)}

main{max-width:1240px;margin:0 auto;padding:20px 24px 80px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.bh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.bh h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.note{margin:0;color:var(--muted);font-size:13px}
.tw{overflow-x:auto;margin:6px 0 14px}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-weight:600;color:var(--muted);font-size:13px;text-align:left;padding:7px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .n{text-align:right}
.tbl tr.total td{font-weight:700;border-top:1px solid var(--ink);background:#f7f9f9}
.tbl tbody tr:hover td{box-shadow:inset 0 0 0 9999px rgba(38,48,47,.03)}
.cw{position:relative;margin-top:8px}
.btn{background:var(--teal-d);color:#fff;border:0;border-radius:7px;padding:7px 16px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.hint{color:var(--muted);font-size:13px}
.warn{color:var(--warn)} .err{color:var(--err)}
.file input{padding:10px;border:1px dashed var(--teal);border-radius:8px;width:100%;background:var(--teal-l)}
.row{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.yin{width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}

#login{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:20}
#login[hidden]{display:none}
#login form{background:#fff;border-radius:12px;padding:30px;width:min(340px,90vw);display:grid;gap:12px}
#login h2{margin:0 0 4px;font-size:20px}
#login input{padding:9px 11px;border:1px solid var(--line);border-radius:7px}
#loginErr{color:var(--err);font-size:13px;min-height:1em;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){header,.bar>div,main{padding-left:14px;padding-right:14px}.block{padding:16px 14px}#tabTools{margin-left:0}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>의대관 모집 통계<span>연도별 비교</span></h1>
    <div class="me"><span id="who"></span><button id="logout" hidden>로그아웃</button></div></div>
  <nav role="tablist">
    <button class="on" data-tab="sum" aria-selected="true">요약</button>
    <button data-tab="grade">성적대별</button>
    <button data-tab="timing">접수 시기</button>
    <button data-tab="dim">항목별</button>
    <button data-tab="flow">입소·퇴소</button>
    <button data-tab="data">데이터 관리</button>
  </nav>
</header>
<div class="bar"><div>
  <div class="grp"><b>연도</b><span id="years"></span></div>
  <div class="grp"><b>시즌</b><span class="segs" id="seasons"></span></div>
  <span id="status"></span>
  <div id="tabTools"></div>
</div></div>
<main id="view"></main>

<div id="login" hidden>
  <form id="loginForm">
    <h2>로그인</h2>
    <input id="em" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <p id="loginErr"></p>
    <button class="btn" type="submit">로그인</button>
  </form>
</div>
<div id="toast" role="status"></div>

<script>
/* ===== 데이터 변환·집계 (순수 함수) ===== */
const COLS = {
  a: ['원서접수일', '접수일'], i: ['입소일'], o: ['퇴소일'], e: ['등원예정일'],
  ty: ['시험유형', '시즌'], m: ['전형방법', '전형'], sx: ['성별'], bd: ['생년월일'],
  sc: ['출신학교'], ad: ['학생주소1', '주소'], gb: ['구분'],
  g0: ['등급 국'], g1: ['등급 수'], g2: ['등급 영'], g3: ['등급 탐1'], g4: ['등급 탐2'], g5: ['등급 한국사'],
  p0: ['백분위 국어'], p1: ['백분위 수학'], p2: ['백분위 탐1'], p3: ['백분위 탐2'],
  sk: ['국어(선택)'], sm: ['수학(선택)'], t1: ['탐구1'], t2: ['탐구2'], l2: ['제2외']
};
const REQUIRED = ['a', 'i', 'ty'];
const SEASON_ORDER = ['윈터스쿨', '시즌제로', '정규시즌', '반수시즌'];
const SIDO = { '서울': '서울', '경기': '경기', '인천': '인천', '부산': '부산', '대구': '대구', '광주': '광주', '대전': '대전', '울산': '울산', '세종': '세종', '강원': '강원', '충청북': '충북', '충북': '충북', '충청남': '충남', '충남': '충남', '전라북': '전북', '전북': '전북', '전라남': '전남', '전남': '전남', '경상북': '경북', '경북': '경북', '경상남': '경남', '경남': '경남', '제주': '제주' };

const p2 = n => String(n).padStart(2, '0');
function ymd(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    if (v > 19000000 && v < 21000000) { const s = String(Math.floor(v)); return `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`; }
    if (v > 20000 && v < 80000) { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${p2(d.m)}-${p2(d.d)}`; }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  if (/^\d+(\.\d+)?$/.test(s)) return ymd(Number(s));
  return null;
}
const dnum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const num = v => { if (v == null || v === '') return null; const n = Number(v); return isNaN(n) ? null : n; };
const str = v => (v == null ? '' : String(v).trim());

function seasonOf(raw) {
  const s = str(raw).toLowerCase();
  if (s.includes('zero') || s.includes('제로')) return '시즌제로';
  if (s.includes('정규')) return '정규시즌';
  if (s.includes('반수')) return '반수시즌';
  if (s.includes('윈터')) return '윈터스쿨';
  return str(raw) || '미지정';
}
function basisOf(raw) {
  const s = str(raw);
  if (!s) return '미입력';
  if (s.includes('6월')) return '6월 평가원';
  if (s.includes('9월')) return '9월 평가원';
  if (s.includes('수능')) return '수능';
  if (s.includes('내신')) return '내신';
  if (s.includes('대학')) return '대학 합격·재학';
  if (s.includes('과학고') || s.includes('영재고')) return '과학고·영재고';
  return '기타';
}
function sidoOf(addr) {
  const t = str(addr).split(/\s+/)[0] || '';
  for (const k of Object.keys(SIDO)) if (t.startsWith(k)) return SIDO[k];
  return '';
}
function sigunguOf(addr) {
  const parts = str(addr).split(/\s+/);
  const sido = sidoOf(addr);
  if (!sido) return '';
  let sg = parts[1] || '';
  if (/시$/.test(sg) && /[구군]$/.test(parts[2] || '')) sg += ' ' + parts[2];
  return sido === '세종' ? '세종' : `${sido} ${sg}`.trim();
}

/* 엑셀 시트 → 개인정보 제외한 압축 행 */
function mapHeaders(headers) {
  const map = {}, missing = [];
  for (const [k, names] of Object.entries(COLS)) {
    const idx = headers.findIndex(h => names.includes(str(h)));
    if (idx >= 0) map[k] = headers[idx]; else missing.push(names[0]);
  }
  return { map, missing };
}
function convertSheet(ws) {
  const json = XLSX.utils.sheet_to_json(ws, { raw: true, defval: null });
  const headers = json.length ? Object.keys(json[0]) : [];
  const { map, missing } = mapHeaders(headers);
  const lack = REQUIRED.filter(k => !map[k]).map(k => COLS[k][0]);
  const get = (r, k) => (map[k] ? r[map[k]] : null);
  const rows = [];
  for (const r of json) {
    const tyRaw = str(get(r, 'ty'));
    const a = ymd(get(r, 'a'));
    if (!tyRaw && !a) continue;
    const iRaw = get(r, 'i'), i = ymd(iRaw);
    const bd = get(r, 'bd'), bdS = ymd(bd);
    const school = str(get(r, 'sc'));
    const scRg = (school.match(/\[(.+?)\]/) || [])[1] || '';
    const g = [0, 1, 2, 3, 4, 5].map(n => num(get(r, 'g' + n)));
    const p = [0, 1, 2, 3].map(n => num(get(r, 'p' + n)));
    rows.push({
      a, i, ir: i ? '' : str(iRaw), o: ymd(get(r, 'o')), e: ymd(get(r, 'e')),
      ty: tyRaw, se: seasonOf(tyRaw), m: str(get(r, 'm')) || '미입력', sx: str(get(r, 'sx')),
      by: bdS ? Number(bdS.slice(0, 4)) : null,
      sc: school.replace(/\s*\[.*?\]\s*/g, '').trim(), sr: scRg,
      sd: sidoOf(get(r, 'ad')), sg: sigunguOf(get(r, 'ad')),
      gb: basisOf(get(r, 'gb')), g, p,
      sk: str(get(r, 'sk')), sm: str(get(r, 'sm')), t1: str(get(r, 't1')), t2: str(get(r, 't2')), l2: str(get(r, 'l2'))
    });
  }
  return { rows, missing, lack, total: json.length };
}
function guessYear(rows) {
  const c = {};
  for (const r of rows) { const d = r.i || r.e; if (d) c[d.slice(0, 4)] = (c[d.slice(0, 4)] || 0) + 1; }
  const best = Object.entries(c).sort((x, y) => y[1] - x[1])[0];
  return best ? Number(best[0]) : new Date().getFullYear();
}

/* 파생 필드 */
const SCI = ['물리', '화학', '생명', '지구'];
function tamType(t) { if (!t) return ''; return SCI.some(s => t.includes(s)) ? '과탐' : '사탐'; }
function gradeSum(g) {
  const [k, m, e, t1, t2] = g;
  if (m == null) return null;
  const o = [k, e, t1, t2].filter(x => x != null).sort((a, b) => a - b);
  return o.length < 2 ? null : m + o[0] + o[1];
}
function enrich(row, year) {
  const r = Object.assign({}, row, { y: year });
  r.in = !!r.i;
  r.st = r.in ? (r.o ? '입소 후 퇴소' : '재원·수료') : (r.o ? '접수 취소' : '미입소');
  r.gs = gradeSum(r.g || []);
  r.n = r.by ? year - r.by - 18 : null;
  const a = tamType(r.t1), b = tamType(r.t2);
  r.tt = !a && !b ? '' : (a === b ? a + ' 2과목' : (a && b ? '사탐+과탐' : (a || b)));
  return r;
}
function nLabel(n) {
  if (n == null) return '미입력';
  if (n <= 0) return '고3·현역';
  if (n === 1) return '재수';
  if (n === 2) return '삼수';
  if (n === 3) return '사수';
  return '오수 이상';
}
function gsLabel(v) { if (v == null) return '성적 없음'; if (v <= 3) return '3'; if (v >= 16) return '16 이상'; return String(v); }
function gsOrder(l) { return l === '성적 없음' ? 99 : (l === '16 이상' ? 16 : Number(l)); }

/* 기준 입소일: 시즌·연도별 가장 많은 입소일 (없으면 등원예정일) */
function refDate(rows) {
  const pick = f => { const c = {}; rows.forEach(r => { const v = f(r); if (v) c[v] = (c[v] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || null; };
  return pick(r => r.i) || pick(r => r.e);
}
function weeksBefore(a, ref) { return Math.floor((dnum(ref) - dnum(a)) / 7); }

</script>
<script type="module">
/* ===== Firebase 설정: 본인 프로젝트 값으로 바꿔주세요 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyC8dvj_xNgRknmk-DSO8qQguvC8q3OVTJQ",
  authDomain: "campusm-statistics.firebaseapp.com",
  projectId: "campusm-statistics",
  storageBucket: "campusm-statistics.firebasestorage.app",
  messagingSenderId: "623107280075",
  appId: "1:623107280075:web:df708c4b64a96538d09f4e"
};
const COL = 'stat_years';      // Firestore 컬렉션 이름
const CHUNK = 600;             // 문서 하나에 담을 행 수

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const LOCAL = firebaseConfig.apiKey.startsWith('YOUR_');
let db = null, auth = null;
if (!LOCAL) { const app = initializeApp(firebaseConfig); db = getFirestore(app); auth = getAuth(app); }

/* ===== 상태 ===== */
const S = { metas: [], rows: [], years: new Set(), season: '전체', tab: 'sum', pending: null, local: {} };
const $ = (q, el = document) => el.querySelector(q);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; else if (v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c)));
  return e;
};
const fmt = n => (n == null ? '–' : Number(n).toLocaleString('ko-KR'));
const pct = (a, b) => (b ? (a / b * 100).toFixed(1) + '%' : '–');
const YEAR_COLORS = ['#3dbbb1', '#5b7c99', '#e0a43a', '#c9706b', '#8a6fb0', '#6aa36f', '#9a8f7a'];
const yearColor = y => { const ys = [...S.years].sort((a, b) => b - a); return YEAR_COLORS[ys.indexOf(y) % YEAR_COLORS.length] || '#999'; };

/* ===== 데이터 입출력 ===== */
function wrap(r, y, c, j) { const e = enrich(r, y); e._raw = r; e._c = c; e._j = j; e.x = r.x || ''; return e; }
async function saveFlags(year, chunks) {
  if (LOCAL) return;
  const b = writeBatch(db);
  chunks.forEach(k => {
    const raws = S.rows.filter(r => r.y === year && r._c === k).sort((a, c) => a._j - c._j).map(r => r._raw);
    b.set(doc(db, COL, String(year), 'rows', 'c' + String(k).padStart(3, '0')), { k, rows: raws });
  });
  await b.commit();
}
/* 본 접수 시작일보다 앞선 접수 = 튀는 값 후보 */
function mainStart(rows) {
  const ds = rows.map(r => r.a).filter(Boolean).sort();
  const need = Math.max(5, Math.ceil(ds.length * 0.01));
  for (let i = 0; i < ds.length; i++) {
    const end = dnum(ds[i]) + 6;
    let n = 0; for (let j = i; j < ds.length && dnum(ds[j]) <= end; j++) n++;
    if (n >= need) return ds[i];
  }
  return ds[0] || null;
}
function outlierList() {
  const out = [];
  S.metas.forEach(m => {
    const ry = S.rows.filter(r => r.y === m.year);
    seasonsIn(ry).forEach(se => {
      const rs = ry.filter(r => r.se === se), st = mainStart(rs);
      rs.forEach(r => { if (r.x || (st && r.a && r.a < st)) out.push({ r, st }); });
    });
  });
  return out.sort((a, b) => a.r.y - b.r.y || (a.r.a || '').localeCompare(b.r.a || ''));
}
async function loadAll() {
  setStatus('불러오는 중…');
  S.metas = []; S.rows = [];
  if (LOCAL) {
    for (const [y, v] of Object.entries(S.local)) { S.metas.push(v.meta); v.rows.forEach((r, j) => S.rows.push(wrap(r, Number(y), Math.floor(j / CHUNK), j))); }
  } else {
    const ms = await getDocs(collection(db, COL));
    await Promise.all(ms.docs.map(async d => {
      const m = d.data(); S.metas.push(m);
      const cs = await getDocs(collection(db, COL, d.id, 'rows'));

async function saveYear(year, rows, fileName) {

function viewFlow() {
  const rows = filtered(), ys = yearsSel();
  const b = block('월별 입소·퇴소', '퇴소 = 입소 후 퇴소, 취소 = 입소 없이 퇴소일만 있는 접수 취소 (각각 해당 날짜의 월 기준)');
  const keys = new Set();
  const m = {}; ys.forEach(y => m[y] = {});
  const add = (y, k, f) => { keys.add(k); m[y][k] ??= { i: 0, o: 0, c: 0 }; m[y][k][f]++; };
  rows.forEach(r => {
    if (r.i) add(r.y, monthKey(r.i, r.y), 'i');
    if (r.o) add(r.y, monthKey(r.o, r.y), r.in ? 'o' : 'c');
  });
  const ks = [...keys].sort((a, b) => a - b);
  table(b, '월별 입소퇴소', ['월', ...ys.flatMap(y => [`${y} 입소`, `${y} 퇴소`, `${y} 취소`])], ks.map(k => [monthLabel(k), ...ys.flatMap(y => { const c = m[y][k] || { i: 0, o: 0, c: 0 }; return [c.i, c.o, c.c]; })]));
  chart(b, {
    type: 'bar', data: { labels: ks.map(monthLabel), datasets: ys.flatMap(y => [{ label: `${y} 입소`, backgroundColor: yearColor(y), data: ks.map(k => m[y][k]?.i || 0) }, { label: `${y} 퇴소`, backgroundColor: yearColor(y) + '66', data: ks.map(k => -(m[y][k]?.o || 0)) }]) },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { ticks: { callback: v => Math.abs(v) } } } }
  });

  const b2 = block('퇴소까지 재원 기간', '입소 후 퇴소한 인원의 입소일~퇴소일 간격');
  const buckets = ['1개월 미만', '1~2개월', '2~3개월', '3~4개월', '4~6개월', '6개월 이상'];
  const bk = d => d < 30 ? 0 : d < 61 ? 1 : d < 91 ? 2 : d < 122 ? 3 : d < 183 ? 4 : 5;
  const by = {}; ys.forEach(y => by[y] = buckets.map(() => 0));
  rows.filter(r => r.in && r.o).forEach(r => { const d = dnum(r.o) - dnum(r.i); if (d >= 0) by[r.y][bk(d)]++; });
  const out = buckets.map((l, i) => [l, ...ys.flatMap(y => { const t = by[y].reduce((a, c) => a + c, 0); return [by[y][i], rate(by[y][i], t)]; })]);
  table(b2, '재원기간', ['기간', ...ys.flatMap(y => [`${y} 인원`, `${y} 비율`])], out);

  const b3 = block('시즌별 퇴소율', '등록 인원 중 입소 후 퇴소 비율');
  const body3 = [];
  ys.forEach(y => seasonsIn(rows.filter(r => r.y === y)).forEach(s => { const en = rows.filter(r => r.y === y && r.se === s && r.in); const o = count(en, r => r.o); body3.push([String(y), s, en.length, o, rate(o, en.length)]); }));
  table(b3, '시즌별 퇴소율', ['연도', '시즌', '등록', '입소 후 퇴소', '퇴소율'], body3);
}

/* ===== 탭: 데이터 관리 ===== */
function viewData() {
  const b = block('저장된 연도', LOCAL ? 'Firebase 설정 전입니다. 지금 올린 파일은 이 창을 닫으면 사라집니다.' : null);
  if (!S.metas.length) b.append(h('p', { class: 'empty' }, '아직 저장된 연도가 없습니다. 아래에서 원생마스터 엑셀을 올려주세요.'));
  else b.append(h('div', { class: 'tw' }, h('table', { class: 'tbl' },
    h('thead', {}, h('tr', {}, ['연도', '행 수', '파일', '저장 시각', ''].map((c, i) => h('th', { class: i === 1 ? 'n' : '' }, c)))),
    h('tbody', {}, S.metas.map(m => h('tr', {},
      h('td', {}, String(m.year)), h('td', { class: 'n' }, fmt(m.count)), h('td', {}, m.fileName || ''),
      h('td', {}, (m.uploadedAt || '').replace('T', ' ').slice(0, 16)),
      h('td', { class: 'n' }, h('button', { class: 'btn ghost', onclick: async () => {
        if (!confirm(`${m.year}년 데이터를 삭제할까요? 되돌릴 수 없습니다.`)) return;
        await deleteYear(m.year); await loadAll(); toast(`${m.year}년 데이터를 삭제했습니다`);
      } }, '삭제'))))))));

  viewOutliers();
  const u = block('엑셀 올리기', '원생마스터 다운로드 파일을 그대로 올리면 됩니다. 성명·생년월일(연도만 보관)·상세 주소(시·군·구만 보관)·비고·수험번호는 저장하지 않습니다.');
  const file = h('input', { type: 'file', accept: '.xlsx,.xls,.csv', id: 'file' });
  const prev = h('div', { id: 'prev' });
  file.addEventListener('change', async () => {
    const f = file.files[0]; if (!f) return;
    prev.innerHTML = '읽는 중…';
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const res = convertSheet(ws);
      if (res.lack.length) { prev.innerHTML = ''; prev.append(h('p', { class: 'err' }, `필수 열이 없습니다: ${res.lack.join(', ')}. 첫 행이 열 제목인지 확인해주세요.`)); return; }
      S.pending = { rows: res.rows, fileName: f.name };
      renderPreview(prev, res, guessYear(res.rows));
    } catch (e) { prev.innerHTML = ''; prev.append(h('p', { class: 'err' }, '파일을 읽지 못했습니다: ' + e.message)); }
  });
  u.append(h('label', { class: 'file' }, file), prev);
}
function renderPreview(prev, res, year) {
  prev.innerHTML = '';
  const yin = h('input', { type: 'number', value: year, min: 2000, max: 2100, class: 'yin', 'aria-label': '운영 연도' });
  const ss = {}; res.rows.forEach(r => { ss[r.ty] ??= { se: r.se, a: 0, e: 0 }; ss[r.ty].a++; if (r.i) ss[r.ty].e++; });
  prev.append(...[
    h('p', {}, `${fmt(res.rows.length)}행을 읽었습니다.`),
    res.missing.length ? h('p', { class: 'warn' }, `없는 열(해당 통계는 비어 보입니다): ${res.missing.join(', ')}`) : null,
    h('div', { class: 'tw' }, h('table', { class: 'tbl' },
      h('thead', {}, h('tr', {}, ['원본 시험유형', '묶이는 시즌', '접수', '입소일 있음'].map((c, i) => h('th', { class: i > 1 ? 'n' : '' }, c)))),
      h('tbody', {}, Object.entries(ss).map(([k, v]) => h('tr', {}, h('td', {}, k), h('td', {}, v.se), h('td', { class: 'n' }, fmt(v.a)), h('td', { class: 'n' }, fmt(v.e))))))),
    h('div', { class: 'row' },
      h('label', {}, '운영 연도 ', yin),
      h('button', { class: 'btn', onclick: async e => {
        const y = Number(yin.value);
        if (!y) return;
        if (S.metas.some(m => m.year === y) && !confirm(`${y}년 데이터가 이미 있습니다. 새 파일로 교체할까요?`)) return;
        e.target.disabled = true; e.target.textContent = '저장 중…';
        try { await saveYear(y, S.pending.rows, S.pending.fileName); S.years.add(y); await loadAll(); toast(`${y}년 데이터를 저장했습니다`); }
        catch (err) { e.target.disabled = false; e.target.textContent = `${y}년으로 저장`; alert('저장하지 못했습니다: ' + err.message); }
      } }, `${year}년으로 저장`))].filter(Boolean));
  yin.addEventListener('input', () => { $('.row .btn', prev).textContent = `${yin.value}년으로 저장`; });
}

const XOPT = [['', '포함'], ['t', '접수 시기만 제외'], ['a', '전체 제외']];
function viewOutliers() {
  if (!S.metas.length) return;
  const list = outlierList();
  const b = block('튀는 값 확인', '본 접수가 시작되기 전에 따로 떨어져 들어온 접수입니다. 실제 다닌 학생이면 "접수 시기만 제외", 테스트·다른 과정·중복이면 "전체 제외"를 고르세요.');
  if (!list.length) { b.append(h('p', { class: 'empty' }, '튀는 값이 없습니다.')); return; }
  const changes = new Map();
  const btn = h('button', { class: 'btn', disabled: '', onclick: async () => {
    btn.disabled = true; btn.textContent = '저장 중…';
    const touched = {};
    changes.forEach((v, r) => { r._raw.x = v || null; if (!v) delete r._raw.x; r.x = v; (touched[r.y] ??= new Set()).add(r._c); });
    try { for (const [y, ks] of Object.entries(touched)) await saveFlags(Number(y), ks); toast('처리 상태를 저장했습니다'); render(); }
    catch (e) { alert('저장하지 못했습니다: ' + e.message); btn.disabled = false; btn.textContent = '변경 저장'; }
  } }, '변경 저장');
  b.append(h('div', { class: 'tw' }, h('table', { class: 'tbl' },
    h('thead', {}, h('tr', {}, ['연도', '시즌', '접수일', '본 접수 시작', '차이', '전형', '입소일', '상태', '처리'].map(c => h('th', {}, c)))),
    h('tbody', {}, list.map(({ r, st }) => h('tr', {},
      h('td', {}, String(r.y)), h('td', {}, r.se), h('td', {}, r.a || '–'), h('td', {}, st || '–'),
      h('td', {}, st && r.a && r.a < st ? `${dnum(st) - dnum(r.a)}일 빠름` : '–'),
      h('td', {}, r.m), h('td', {}, r.i || r.ir || '–'), h('td', {}, r.st),
      h('td', {}, h('select', { 'aria-label': '처리', onchange: e => { e.target.value === r.x ? changes.delete(r) : changes.set(r, e.target.value); btn.disabled = !changes.size; } },
        XOPT.map(([v, t]) => { const o = h('option', { value: v }, t); if (v === r.x) o.selected = true; return o; })))))))),
    h('div', { class: 'row' }, btn));
}

/* ===== 렌더 ===== */
const VIEWS = { sum: viewSum, grade: viewGrade, timing: viewTiming, dim: viewDim, flow: viewFlow, data: viewData };
function render() {
  resetView();
  const v = $('#view'); v.innerHTML = '';
  $('#tabTools').innerHTML = '';
  if (S.tab === 'grade') $('#tabTools').append(h('label', {}, '과목 등급 기준 ', h('select', { id: 'gradeTarget', onchange: e => { S._gt = e.target.value; render(); } }, h('option', { value: 'all' }, '접수 전체'), h('option', { value: 'in' }, '등록자'))));
  if (S.tab === 'timing') $('#tabTools').append(
    h('label', {}, '전형별 표 ', h('select', { id: 'unitSel', onchange: e => { S._unit = e.target.value; render(); } }, h('option', { value: 'day' }, '일별'), h('option', { value: 'week' }, '주별'))),
    h('select', { id: 'basisSel', 'aria-label': '인원 기준', onchange: e => { S._basis = e.target.value; render(); } }, h('option', { value: 'all' }, '접수 전체'), h('option', { value: 'in' }, '등록자만')));
  if (S.tab === 'dim') $('#tabTools').append(h('label', {}, '항목 ', h('select', { id: 'dimSel', onchange: e => { S._dim = e.target.value; render(); } }, Object.keys(DIMS).map(k => h('option', {}, k)))));
  if (S.tab !== 'data') {
    if (!S.metas.length) { v.append(h('p', { class: 'empty' }, '저장된 데이터가 없습니다. 데이터 관리 탭에서 엑셀을 올려주세요.')); return; }
    if (!S.years.size) { v.append(h('p', { class: 'empty' }, '위에서 연도를 하나 이상 골라주세요.')); return; }
    $('#tabTools').append(h('button', { class: 'btn ghost', onclick: exportTab }, '이 탭 엑셀로 저장'));
  }
  if (S.tab === 'grade' && S._gt) $('#gradeTarget').value = S._gt;
  if (S.tab === 'dim' && S._dim) $('#dimSel').value = S._dim;
  if (S.tab === 'timing') { $('#unitSel').value = S._unit || 'day'; $('#basisSel').value = S._basis || 'all'; }
  VIEWS[S.tab]();
  S._gt = $('#gradeTarget')?.value || S._gt; S._dim = $('#dimSel')?.value || S._dim;
}
function setStatus(t) { $('#status').textContent = t; }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2400); }

document.querySelectorAll('nav button').forEach(bt => bt.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => { x.classList.toggle('on', x === bt); x.setAttribute('aria-selected', x === bt); });
  S.tab = bt.dataset.tab; render();
}));
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.color = '#5d6766';
Chart.defaults.animation = false;

/* ===== 로그인 ===== */
if (LOCAL) { $('#who').textContent = '로컬 미리보기'; loadAll(); }
else {
  onAuthStateChanged(auth, u => {
    $('#login').hidden = !!u;
    $('#who').textContent = u ? u.email : '';
    $('#logout').hidden = !u;
    if (u) loadAll().catch(e => setStatus('불러오기 실패: ' + e.message));
  });
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('#loginErr').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
    catch (err) { $('#loginErr').textContent = '이메일 또는 비밀번호가 맞지 않습니다.'; }
  });
  $('#logout').addEventListener('click', () => signOut(auth));
}

</script>
</body>
</html>
