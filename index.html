<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의대관 모집 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#26302f; --muted:#6b7473; --line:#dde3e2; --bg:#f0f0f0; --panel:#fff;
  --teal:#3dbbb1; --teal-d:#1f8a82; --teal-l:#e3f4f2; --warn:#b4741c; --err:#b5463f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-d);outline-offset:2px}

header{background:var(--ink);color:#fff;padding:18px 24px 0}
.hrow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
h1 span{font-weight:400;color:#a9b5b3;margin-left:6px}
.me{margin-left:auto;font-size:13px;color:#a9b5b3;display:flex;gap:10px;align-items:center}
.me button{background:none;border:1px solid #56615f;color:#d8dfde;border-radius:6px;padding:3px 10px;cursor:pointer}
#top{display:flex;gap:26px;max-width:1240px;margin:14px auto 0;overflow-x:auto;align-items:flex-end}
.ygrp{display:flex;align-items:center;gap:2px}
.ygrp.end{margin-left:auto}
.yl{font-size:13px;font-weight:700;color:#7f8b89;margin-right:6px;padding-bottom:3px}
#top button{background:none;border:0;color:#a9b5b3;padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:15px}
#top button:hover{color:#fff}
#top button.on{color:#fff;border-bottom-color:var(--teal)}
#sub{display:flex;gap:4px;flex-wrap:wrap}
#sub button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
#sub button:hover{background:var(--bg);color:var(--ink)}
#sub button.on{background:var(--teal-l);color:var(--teal-d);font-weight:700}
#cmp{display:flex;gap:20px;flex-wrap:wrap;width:100%;padding-top:10px;border-top:1px dashed var(--line)}
#cmp[hidden]{display:none}
.bar[hidden]{display:none}

.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar>div{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>b{font-size:13px;color:var(--muted);font-weight:500;margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg{border:0;background:#fff;padding:5px 14px;cursor:pointer;border-left:1px solid var(--line)}
.seg:first-child{border-left:0}
.seg.on{background:var(--teal-l);color:var(--teal-d);font-weight:600}
#tabTools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#tabTools select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
#status{font-size:13px;color:var(--muted)}

main{max-width:1240px;margin:0 auto;padding:20px 24px 80px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.bh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.bh h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.bh-r{margin-left:auto}
.note{margin:0;color:var(--muted);font-size:13px}
.tw{overflow-x:auto;margin:6px 0 14px}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-weight:600;color:var(--muted);font-size:13px;text-align:left;padding:7px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .n{text-align:right}
.tbl tr.total td{font-weight:700;border-top:1px solid var(--ink);background:#f7f9f9}
.tbl tbody tr:hover td{box-shadow:inset 0 0 0 9999px rgba(38,48,47,.03)}
.cw{position:relative;margin-top:8px}
.tbl.rule td{white-space:pre-line;vertical-align:top;line-height:1.6;padding:10px}
.tbl.rule td.k{font-weight:600;white-space:nowrap}
.maps{display:flex;gap:28px;flex-wrap:wrap;margin:4px 0 12px}
.maps figure{margin:0}
.maps figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.tilemap{display:grid;grid-template-columns:repeat(4,78px);grid-auto-rows:62px;gap:5px}
.tile{border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);line-height:1.15}
.tile b{font-size:13px}.tile span{font-size:16px;font-weight:700}.tile small{font-size:11px;opacity:.75}
.tile.dark{color:#fff}
.sub{font-size:15px;margin:18px 0 4px;font-weight:700}
.notes{margin:4px 0 6px;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.7}
.btn{background:var(--teal-d);color:#fff;border:0;border-radius:7px;padding:7px 16px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.hint{color:var(--muted);font-size:13px}
.warn{color:var(--warn)} .err{color:var(--err)}
.file input{padding:10px;border:1px dashed var(--teal);border-radius:8px;width:100%;background:var(--teal-l)}
.flab{margin:12px 0 6px;font-size:14px;font-weight:600}
.row{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.yin{width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}

#login{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:20}
#login[hidden]{display:none}
#login form{background:#fff;border-radius:12px;padding:30px;width:min(340px,90vw);display:grid;gap:12px}
#login h2{margin:0 0 4px;font-size:20px}
#login input{padding:9px 11px;border:1px solid var(--line);border-radius:7px}
#loginErr{color:var(--err);font-size:13px;min-height:1em;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){header,.bar>div,main{padding-left:14px;padding-right:14px}.block{padding:16px 14px}#tabTools{margin-left:0}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>의대관 모집 통계<span>연도별 비교</span></h1>
    <div class="me"><span id="who"></span><button id="logout" hidden>로그아웃</button></div></div>
  <nav id="top" role="tablist" aria-label="연도·시즌"></nav>
</header>
<div class="bar" id="subbar"><div>
  <nav id="sub" role="tablist" aria-label="통계 항목"></nav>
  <div id="cmp" hidden><div class="grp"><b>연도</b><span id="years"></span></div>
  <div class="grp"><b>시즌</b><span class="segs" id="seasons"></span></div></div>
  <span id="status"></span>
  <div id="tabTools"></div>
</div></div>
<main id="view"></main>

<div id="login" hidden>
  <form id="loginForm">
    <h2>로그인</h2>
    <input id="em" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <p id="loginErr"></p>
    <button class="btn" type="submit">로그인</button>
  </form>
</div>
<div id="toast" role="status"></div>

<script>
/* ===== 데이터 변환·집계 (순수 함수) ===== */
const COLS = {
  a: ['원서접수일', '접수일'], i: ['입소일'], o: ['퇴소일'], e: ['등원예정일'],
  ty: ['시험유형', '시즌'], m: ['전형방법', '전형'], sx: ['성별'], bd: ['생년월일'],
  sc: ['출신학교'], ad: ['학생주소1', '주소'], gb: ['구분'],
  g0: ['등급 국'], g1: ['등급 수'], g2: ['등급 영'], g3: ['등급 탐1'], g4: ['등급 탐2'], g5: ['등급 한국사'],
  p0: ['백분위 국어'], p1: ['백분위 수학'], p2: ['백분위 탐1'], p3: ['백분위 탐2'],
  sk: ['국어(선택)'], sm: ['수학(선택)'], t1: ['탐구1'], t2: ['탐구2'], l2: ['제2외'],
  sid: ['수험번호']
};
const REQUIRED = ['a', 'i', 'ty'];
const SEASON_ORDER = ['윈터스쿨', '시즌제로', '정규시즌', '반수시즌'];
const SIDO = { '서울': '서울', '경기': '경기', '인천': '인천', '부산': '부산', '대구': '대구', '광주': '광주', '대전': '대전', '울산': '울산', '세종': '세종', '강원': '강원', '충청북': '충북', '충북': '충북', '충청남': '충남', '충남': '충남', '전라북': '전북', '전북': '전북', '전라남': '전남', '전남': '전남', '경상북': '경북', '경북': '경북', '경상남': '경남', '경남': '경남', '제주': '제주' };

const p2 = n => String(n).padStart(2, '0');
function ymd(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    if (v > 19000000 && v < 21000000) { const s = String(Math.floor(v)); return `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`; }
    if (v > 20000 && v < 80000) { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${p2(d.m)}-${p2(d.d)}`; }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  if (/^\d+(\.\d+)?$/.test(s)) return ymd(Number(s));
  return null;
}
const dnum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const num = v => { if (v == null || v === '') return null; const n = Number(v); return isNaN(n) ? null : n; };
const str = v => (v == null ? '' : String(v).trim());

function seasonOf(raw) {
  const s = str(raw).toLowerCase();
  if (s.includes('zero') || s.includes('제로')) return '시즌제로';
  if (s.includes('정규')) return '정규시즌';
  if (s.includes('반수')) return '반수시즌';
  if (s.includes('윈터')) return '윈터스쿨';
  return str(raw) || '미지정';
}
function basisOf(raw) {
  const s = str(raw);
  if (!s) return '미입력';
  if (s.includes('6월')) return '6월 평가원';
  if (s.includes('9월')) return '9월 평가원';
  if (s.includes('수능')) return '수능';
  if (s.includes('내신')) return '내신';
  if (s.includes('대학')) return '대학 합격·재학';
  if (s.includes('과학고') || s.includes('영재고')) return '과학고·영재고';
  return '기타';
}
function sidoOf(addr) {
  const t = str(addr).split(/\s+/)[0] || '';
  for (const k of Object.keys(SIDO)) if (t.startsWith(k)) return SIDO[k];
  return '';
}
function sigunguOf(addr) {
  const parts = str(addr).split(/\s+/);
  const sido = sidoOf(addr);
  if (!sido) return '';
  let sg = parts[1] || '';
  if (/시$/.test(sg) && /[구군]$/.test(parts[2] || '')) sg += ' ' + parts[2];
  return sido === '세종' ? '세종' : `${sido} ${sg}`.trim();
}

/* 엑셀 시트 → 개인정보 제외한 압축 행 */
function mapHeaders(headers) {
  const map = {}, missing = [];
  for (const [k, names] of Object.entries(COLS)) {
    const idx = headers.findIndex(h => names.includes(str(h)));
    if (idx >= 0) map[k] = headers[idx]; else missing.push(names[0]);
  }
  return { map, missing };
}
/* 매칭 파일(수험번호·등록일·환불일) → 수험번호별 날짜 */
function parseMatch(ws) {
  const json = XLSX.utils.sheet_to_json(ws, { raw: true, defval: null });
  const hs = json.length ? Object.keys(json[0]) : [];
  const f = names => hs.find(h => names.includes(str(h)));
  const kS = f(['수험번호']), kR = f(['등록일', '납부일']), kF = f(['환불일']);
  if (!kS || !kR) return { err: '매칭 파일에 수험번호·등록일 열이 필요합니다.' };
  const map = new Map();
  json.forEach(r => {
    const id = str(r[kS]); if (!id) return;
    const o = map.get(id) || { rd: null, fd: null };
    o.rd = o.rd || ymd(r[kR]); if (kF) o.fd = o.fd || ymd(r[kF]);
    map.set(id, o);
  });
  return { map, size: json.length };
}
function convertSheet(ws, match) {
  const json = XLSX.utils.sheet_to_json(ws, { raw: true, defval: null });
  const headers = json.length ? Object.keys(json[0]) : [];
  const { map, missing } = mapHeaders(headers);
  const lack = REQUIRED.filter(k => !map[k]).map(k => COLS[k][0]);
  const get = (r, k) => (map[k] ? r[map[k]] : null);
  const rows = []; let matched = 0;
  for (const r of json) {
    const tyRaw = str(get(r, 'ty'));
    const a = ymd(get(r, 'a'));
    if (!tyRaw && !a) continue;
    const iRaw = get(r, 'i'), i = ymd(iRaw);
    const bd = get(r, 'bd'), bdS = ymd(bd);
    const school = str(get(r, 'sc'));
    const scRg = (school.match(/\[(.+?)\]/) || [])[1] || '';
    const g = [0, 1, 2, 3, 4, 5].map(n => num(get(r, 'g' + n)));
    const p = [0, 1, 2, 3].map(n => num(get(r, 'p' + n)));
    const mt = match ? match.get(str(get(r, 'sid'))) : null;
    if (match && mt) matched++;
    rows.push({
      ...(match ? { rd: mt?.rd || null, fd: mt?.fd || null } : {}),
      sid: str(get(r, 'sid')),
      a, i, ir: i ? '' : str(iRaw), o: ymd(get(r, 'o')), e: ymd(get(r, 'e')),
      ty: tyRaw, se: seasonOf(tyRaw), m: str(get(r, 'm')) || '미입력', sx: str(get(r, 'sx')),
      by: bdS ? Number(bdS.slice(0, 4)) : null,
      sc: school.replace(/\s*\[.*?\]\s*/g, '').trim(), sr: scRg,
      sd: sidoOf(get(r, 'ad')), sg: sigunguOf(get(r, 'ad')),
      gb: basisOf(get(r, 'gb')), g, p,
      sk: str(get(r, 'sk')), sm: str(get(r, 'sm')), t1: str(get(r, 't1')), t2: str(get(r, 't2')), l2: str(get(r, 'l2'))
    });
  }
  return { rows, missing: missing.filter(m => m !== '수험번호'), lack, total: json.length, matched };
}
function guessYear(rows) {
  const c = {};
  for (const r of rows) { const d = r.i || r.e; if (d) c[d.slice(0, 4)] = (c[d.slice(0, 4)] || 0) + 1; }
  const best = Object.entries(c).sort((x, y) => y[1] - x[1])[0];
  return best ? Number(best[0]) : new Date().getFullYear();
}

/* 파생 필드 */
const SCI = ['물리', '화학', '생명', '지구'];
function tamType(t) { if (!t) return ''; return SCI.some(s => t.includes(s)) ? '과탐' : '사탐'; }
function gradeSum(g) {
  const [k, m, e, t1, t2] = g;
  if (m == null) return null;
  const o = [k, e, t1, t2].filter(x => x != null).sort((a, b) => a - b);
  return o.length < 2 ? null : m + o[0] + o[1];
}
function enrich(row, year) {
  const r = Object.assign({}, row, { y: year });
  r.in = !!r.i;
  r.st = r.in ? (r.o ? '입소 후 퇴소' : '재원·수료') : (r.o ? '접수 취소' : '미입소');
  r.gs = gradeSum(r.g || []);
  r.n = r.by ? year - r.by - 18 : null;
  const a = tamType(r.t1), b = tamType(r.t2);
  r.tt = !a && !b ? '' : (a === b ? a + ' 2과목' : (a && b ? '사탐+과탐' : (a || b)));
  return r;
}
function nLabel(n) {
  if (n == null) return '미입력';
  if (n <= 0) return '고3·현역';
  if (n === 1) return '재수';
  if (n === 2) return '삼수';
  if (n === 3) return '사수';
  return '오수 이상';
}
function gsLabel(v) { if (v == null) return '성적 없음'; if (v <= 3) return '3'; if (v >= 16) return '16 이상'; return String(v); }
function gsOrder(l) { return l === '성적 없음' ? 99 : (l === '16 이상' ? 16 : Number(l)); }

/* 기준 입소일: 시즌·연도별 가장 많은 입소일 (없으면 등원예정일) */
function refDate(rows) {
  const pick = f => { const c = {}; rows.forEach(r => { const v = f(r); if (v) c[v] = (c[v] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || null; };
  return pick(r => r.i) || pick(r => r.e);
}
function weeksBefore(a, ref) { return Math.floor((dnum(ref) - dnum(a)) / 7); }

</script>
<script type="module">

const firebaseConfig = {

};

import { getFirestore, collection, doc, getDocs, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const LOCAL = firebaseConfig.apiKey.startsWith('YOUR_');
let db = null, auth = null;
if (!LOCAL) { const app = initializeApp(firebaseConfig); db = getFirestore(app); auth = getAuth(app); }

/* ===== 상태 ===== */
const S = { metas: [], rows: [], years: new Set(), season: '전체', tab: 'sum', mode: null, cur: null, pending: null, local: {} };
const $ = (q, el = document) => el.querySelector(q);
const h = (tag, attrs = {}, ...kids) => {

/* 저장된 연도에 매칭 파일만 붙이기 */
function viewMatchOnly() {
  if (!S.metas.length) return;
  const b = block('매칭 파일만 올리기', '이미 저장된 연도에 등록일·환불일을 붙이거나 새 매칭 파일로 바꿉니다. 수험번호로 연결합니다.');
  const ysel = h('select', { class: 'yin', 'aria-label': '연도' }, [...S.metas].reverse().map(m => h('option', { value: m.year }, String(m.year))));
  const f = h('input', { type: 'file', accept: '.xlsx,.xls,.csv' });
  const out = h('div');
  const btn = h('button', { class: 'btn', disabled: '' }, '매칭 저장');
  let M = null;
  const check = () => {
    out.innerHTML = ''; btn.disabled = true; if (!M) return;
    const y = Number(ysel.value), rows = S.rows.filter(r => r.y === y);
    if (!rows.some(r => r._raw.sid)) { out.append(h('p', { class: 'err' }, `${y}년 데이터에는 수험번호가 없습니다. 아래 "엑셀 올리기"에서 원생마스터와 매칭 파일을 같이 올려 다시 저장해주세요.`)); return; }
    const hit = rows.filter(r => M.map.has(r._raw.sid)).length;
    out.append(h('p', {}, `${y}년 ${fmt(rows.length)}행 중 ${fmt(hit)}행 연결 (매칭 파일 ${fmt(M.size)}행). 연결 안 된 행은 등록·환불 없음으로 바뀝니다.`));
    btn.disabled = false;
  };
  f.addEventListener('change', async () => {
    const x = f.files[0]; if (!x) { M = null; check(); return; }
    try { const wb = XLSX.read(await x.arrayBuffer(), { type: 'array' }); M = parseMatch(wb.Sheets[wb.SheetNames[0]]); if (M.err) { alert(M.err); M = null; } }
    catch (e) { alert('파일을 읽지 못했습니다: ' + e.message); M = null; }
    check();
  });
  ysel.addEventListener('change', check);
  btn.addEventListener('click', async () => {
    const y = Number(ysel.value), rows = S.rows.filter(r => r.y === y), chunks = new Set(); let hit = 0;
    rows.forEach(r => {
      const mt = M.map.get(r._raw.sid), rd = mt?.rd || null, fd = mt?.fd || null;
      if (mt) hit++;
      if (r._raw.rd !== rd || r._raw.fd !== fd) { r._raw.rd = rd; r._raw.fd = fd; r.rd = rd; r.fd = fd; chunks.add(r._c); }
    });
    btn.disabled = true; btn.textContent = '저장 중…';
    try { await saveFlags(y, chunks, { matched: hit }); await loadAll(); toast(`${y}년 매칭을 저장했습니다 (${fmt(hit)}행)`); }
    catch (e) { alert('저장하지 못했습니다: ' + e.message); btn.disabled = false; btn.textContent = '매칭 저장'; }
  });
  b.append(h('div', { class: 'row' }, h('label', {}, '연도 ', ysel), h('label', { class: 'file', style: 'flex:1' }, f), btn), out);
}

      notes: ['각 전형별 성적 조건 중 해당하는 성적 하나만 있으면 지원 가능', '선발 환산점수 계산기로 6평·9평·수능 중 유리한 성적표 1개만 제출', '합격자 발표: 홈페이지 조회 및 개별 안내'],
      scholar: {

          ['', '백분위 합 289점 이상', '[교습비+독서실비+기숙사비+식비] 100% + [교재비] 50% 면제', '3개'],

          ['', '백분위 합 281점 이상', '[교습비+독서실비] 100% + [교재비] 50% 면제', '3개'],
          ['', '백분위 합 278점 이상', '[교습비] 50% + [독서실비] 100% 면제', '5개'],

};

/* ===== 탭: 성적조건 / 장학제도 ===== */
function ruleTargets() {
  const ys = (S.years.size ? yearsSel() : Object.keys(RULES).map(Number)).filter(y => RULES[y]).sort((a, b) => b - a);
  const out = [];
  ys.forEach(y => Object.keys(RULES[y]).sort((a, b) => SEASON_ORDER.indexOf(a) - SEASON_ORDER.indexOf(b))
    .forEach(s => { if (S.season === '전체' || S.season === s) out.push([y, s, RULES[y][s]]); }));
  return out;
}
function textTable(parent, name, head, body, opt = {}) {
  exportables.push({ name, head, body });
  parent.append(h('div', { class: 'tw' }, h('table', { class: 'tbl rule' },
    h('thead', {}, h('tr', {}, head.map((c, i) => h('th', { class: (opt.num || []).includes(i) ? 'n' : '' }, c)))),
    h('tbody', {}, body.map(r => h('tr', { class: r.total ? 'total' : '' }, r.map((c, i) => h('td', { class: [(opt.num || []).includes(i) ? 'n' : '', i === 0 ? 'k' : ''].join(' ') }, typeof c === 'number' ? fmt(c) : (c ?? '')))))))));
}
const notesEl = list => h('ul', { class: 'notes' }, list.map(t => h('li', {}, t)));
function noRules() { $('#view').append(h('p', { class: 'empty' }, `모집요강 자료는 ${Object.keys(RULES).join(', ')}년만 들어 있습니다.`)); }
function viewRule() {
  const ts = ruleTargets(); if (!ts.length) return noRules();
  ts.forEach(([y, s, R]) => {
    const b = block(`${y} ${s} 모집 전형`, R.period);
    const rows = S.rows.filter(r => r.y === y && r.se === s && r.x !== 'a');
    const has = rows.length > 0;
    const body = R.methods.map(([m, q, p]) => {
      const g = rows.filter(r => r.m === m), e = count(g, r => r.in);
      return [m, q, p, ...(has ? [g.length, e, g.length ? pct(e, g.length) : '–'] : [])];
    });
    textTable(b, `${y} ${s} 전형`, ['전형', '지원 자격', '접수 및 등록', ...(has ? ['접수', '등록', '등록률'] : [])], body, { num: has ? [3, 4, 5] : [] });
    b.append(h('h3', { class: 'sub' }, '성적순 전형 차수별 합격자 발표'));
    textTable(b, `${y} ${s} 발표일정`, ['차수', '접수 기간', '합격자 발표'], R.rounds);
    b.append(notesEl(R.notes));
  });
}
function viewScholar() {
  const ts = ruleTargets(); if (!ts.length) return noRules();
  ts.forEach(([y, s, R]) => {
    const C = R.scholar;
    const b = block(`${y} ${s} 장학 제도`, R.period);
    b.append(h('h3', { class: 'sub' }, '일반 장학'));
    textTable(b, `${y} ${s} 일반장학`, ['성적 기준', '자격 요건 (국·수·탐(2) 백분위 합)', '장학 혜택', '최소 수강 강의 수'], C.general);
    b.append(notesEl(C.generalNotes));
    b.append(h('h3', { class: 'sub' }, '내신 장학'));
    textTable(b, `${y} ${s} 내신장학`, ['자격 요건', '장학 혜택'], C.naesin);
    b.append(notesEl(C.naesinNotes));
    b.append(h('h3', { class: 'sub' }, '특별 장학'));
    textTable(b, `${y} ${s} 특별장학`, ['자격 요건', '장학 혜택'], C.special);
  });
}

/* ===== 렌더 ===== */
const VIEWS = { rule: viewRule, scholar: viewScholar, sum: viewSum, region: viewRegion, timing: () => viewTiming('pre'), after: () => viewTiming('post'), dim: viewDim, flow: viewFlow, data: viewData };
function render() {
  resetView();
  const v = $('#view'); v.innerHTML = '';
  $('#tabTools').innerHTML = '';
  if (S.tab === 'region') $('#tabTools').append(h('label', {}, '지도 기준 ', h('select', { id: 'mapSel', onchange: e => { S._mapBasis = e.target.value; render(); } }, h('option', { value: 'a' }, '접수'), h('option', { value: 'e' }, '등록'))));
  if (S.tab === 'timing' || S.tab === 'after') $('#tabTools').append(
    h('span', { class: 'segs', role: 'group', 'aria-label': '보기' }, [['reg', S.tab === 'after' ? '입소별' : '등록별'], ['method', '전형별']].map(([k, t]) =>
      h('button', { class: 'seg' + ((S._view || 'reg') === k ? ' on' : ''), 'aria-pressed': (S._view || 'reg') === k, onclick: () => { S._view = k; render(); } }, t))),
    h('button', { class: 'chip' + (S._gender ? ' on' : ''), 'aria-pressed': !!S._gender, onclick: () => { S._gender = !S._gender; render(); } }, '남녀 나눠 보기'),
    h('label', {}, '단위 ', h('select', { id: 'unitSel', onchange: e => { (S._units ??= {})[unitKey()] = e.target.value; render(); } }, h('option', { value: 'week' }, '주별'), h('option', { value: 'month' }, '월별'), h('option', { value: 'day' }, '일별'))));
  if (S.tab === 'dim') $('#tabTools').append(h('label', {}, '항목 ', h('select', { id: 'dimSel', onchange: e => { S._dim = e.target.value; render(); } }, Object.keys(DIMS).map(k => h('option', {}, k)))));
  const isRule = S.tab === 'rule' || S.tab === 'scholar';
  if (S.tab !== 'data') {
    if (!S.metas.length && !isRule) { v.append(h('p', { class: 'empty' }, '저장된 데이터가 없습니다. 데이터 관리 탭에서 엑셀을 올려주세요.')); return; }
    if (!S.years.size && !isRule) { v.append(h('p', { class: 'empty' }, '위에서 연도를 하나 이상 골라주세요.')); return; }
    $('#tabTools').append(h('button', { class: 'btn ghost', onclick: exportTab }, '이 탭 엑셀로 저장'));
  }
  if (S.tab === 'region') $('#mapSel').value = S._mapBasis || 'a';
  if (S.tab === 'dim' && S._dim) $('#dimSel').value = S._dim;
  if (S.tab === 'timing' || S.tab === 'after') { $('#unitSel').value = curUnit(); }
  VIEWS[S.tab]();
  S._dim = $('#dimSel')?.value || S._dim;
}
function setStatus(t) { $('#status').textContent = t; }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2400); }

const SUBTABS = [['sum', '요약'], ['region', '지역분포'], ['timing', '접수 시기'], ['after', '개강 후'], ['dim', '항목별'], ['flow', '입소·퇴소'], ['rule', '성적조건'], ['scholar', '장학제도']];
function topEntries() {
  const ys = [...new Set([...S.metas.map(m => m.year), ...Object.keys(RULES).map(Number)])].sort((a, b) => b - a);
  return ys.map(y => {
    const ss = [...new Set([...seasonsIn(S.rows.filter(r => r.y === y && r.x !== 'a')), ...Object.keys(RULES[y] || {})])];
    ss.sort((a, b) => (SEASON_ORDER.indexOf(a) + 1 || 99) - (SEASON_ORDER.indexOf(b) + 1 || 99));
    return [y, ss];
  }).filter(e => e[1].length);
}
function selectYS(y, s, quiet) {
  S.mode = 'ys'; S.cur = [y, s]; S.years = new Set([y]); S.season = s;
  if (S.tab === 'data') S.tab = 'sum';
  if (!quiet) { renderNav(); render(); }
}
function renderNav() {
  const top = $('#top'); top.innerHTML = '';
  topEntries().forEach(([y, ss]) => top.append(h('div', { class: 'ygrp' }, h('span', { class: 'yl' }, String(y)),
    ss.map(s => { const on = S.mode === 'ys' && S.cur[0] === y && S.cur[1] === s; return h('button', { class: on ? 'on' : '', 'aria-selected': on, onclick: () => selectYS(y, s) }, s); }))));
  const right = h('div', { class: 'ygrp end' });
  if (S.metas.length > 1 || S.mode === 'compare') right.append(h('button', { class: S.mode === 'compare' ? 'on' : '', onclick: () => {
    S.mode = 'compare'; S.years = new Set(S.metas.map(m => m.year).slice(-3)); S.season = S.cur?.[1] || '전체';
    if (S.tab === 'data') S.tab = 'sum'; renderNav(); render();
  } }, '연도 비교'));
  right.append(h('button', { class: S.mode === 'data' ? 'on' : '', onclick: () => { S.mode = 'data'; S.tab = 'data'; renderNav(); render(); } }, '데이터 관리'));
  top.append(right);
  const sub = $('#sub'); sub.innerHTML = '';
  $('#subbar').hidden = S.mode === 'data';
  SUBTABS.forEach(([k, t]) => sub.append(h('button', { class: S.tab === k ? 'on' : '', 'aria-selected': S.tab === k, onclick: () => { S.tab = k; renderNav(); render(); } }, t)));
  $('#cmp').hidden = S.mode !== 'compare';
  if (S.mode === 'compare') renderFilters();
}
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.color = '#5d6766';
Chart.defaults.animation = false;

/* ===== 로그인 ===== */
if (LOCAL) { $('#who').textContent = '로컬 미리보기'; loadAll(); }
else {
  onAuthStateChanged(auth, u => {
    $('#login').hidden = !!u;
    $('#who').textContent = u ? u.email : '';
    $('#logout').hidden = !u;
    if (u) loadAll().catch(e => setStatus('불러오기 실패: ' + e.message));
  });
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('#loginErr').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
    catch (err) { $('#loginErr').textContent = '이메일 또는 비밀번호가 맞지 않습니다.'; }
  });
  $('#logout').addEventListener('click', () => signOut(auth));
}
